server:
  port: 8084
spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/jaggery
    username: postgres
    password: root
  jpa:
    hibernate:
      ddl-auto: update
    database-platform: org.hibernate.dialect.PostgreSQLDialect
  kafka:
    producer:
      bootstrap-servers: localhost:9092
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

resilience4j:
  circuitbreaker:
    instances:
      customerCB:
        registerHealthIndicator: true
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        permittedNumberOfCallsInHalfOpenState: 3
        waitDurationInOpenState: 10s
        failureRateThreshold: 50
        automaticTransitionFromOpenToHalfOpenEnabled: true
        slidingWindowType: count_based
        max-attempts: 5
        wait-duration: 2s
        timeout-duration: 0
        limit-refresh-period: 4
        limit-for-period: 2
application:
  config:
    customer-url: http://localhost:8222/api/v1/customer
    product-url: http://localhost:8222/api/v1/product
    notification-url: http://localhost:8222/api/v1/notification
    payment-url: http://localhost:8222/api/v1/payment
management:
  health:
    circuitbreakers:
      enabled: true
eureka:
  instance:
    hostname: localhost
    instanceId: ${spring.application.name}
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka