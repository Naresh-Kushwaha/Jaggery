server:
  port: 8888
spring:

  profiles:
    active: dev
  application:
    name: config-server
  cloud:
    config:
      server:
        git:
          uri: ${GIT_URI}
          username: ${GIT_USERNAME}
          password: ${GIT_PASSWORD}
          clone-on-start: true
management:
  endpoints:
    web:
      exposure:
        include: '*'

